name: Release

on:
  push:
    tags:
      # GitHub tag filters are globs, not regular expressions. Validate the
      # exact vX.Y.Z shape in the first job.
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing workspace version to package (dry run; does not publish)"
        required: true
        type: string

# Builds only need repository contents. Publishing and provenance permissions are
# granted to the individual jobs that need them.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release request
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust 1.90
        uses: dtolnay/rust-toolchain@0176485ebe2f605bde554dd99f804beeaf7db3e2 # 1.90.0

      - name: Validate tag and workspace version
        id: release
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          workspace_version="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "aden") | .version')"
          if [[ -z "$workspace_version" || "$workspace_version" == "null" ]]; then
            echo "Could not determine the aden workspace version" >&2
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            requested_tag="${GITHUB_REF_NAME}"
            requested_version="${requested_tag#v}"
          else
            requested_version="${DISPATCH_VERSION#v}"
            requested_tag="v${requested_version}"
          fi

          if [[ "$requested_version" != "$workspace_version" ]]; then
            echo "Release request ${requested_tag} does not match workspace version ${workspace_version}" >&2
            exit 1
          fi
          if [[ ! "$requested_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the exact form vX.Y.Z: ${requested_tag}" >&2
            exit 1
          fi
          version_regex="${workspace_version//./\\.}"
          if ! grep -Eq "^## \\[${version_regex}\\]( |$)" CHANGELOG.md; then
            echo "CHANGELOG.md has no release heading for ${workspace_version}" >&2
            exit 1
          fi

          # Published tags must identify reviewed code on main. A manually
          # dispatched dry-run intentionally remains usable from a feature branch
          # so the release machinery itself can be integration-tested pre-merge.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Release commit ${GITHUB_SHA} is not on origin/main" >&2
              exit 1
            fi
          fi

          echo "version=${workspace_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${requested_tag}" >> "$GITHUB_OUTPUT"

      - name: Require successful ordinary CI for this release commit
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Poll only push runs from ci.yml for this exact commit. This cannot
          # select the current release workflow, a PR run, or CI for another SHA.
          # A tag may be pushed while the main-branch CI run is still underway,
          # so wait for at most 30 minutes (120 * 15 seconds).
          for attempt in $(seq 1 120); do
            runs="$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
              -f event=push \
              -f head_sha="$GITHUB_SHA" \
              -f per_page=100)"
            run="$(jq -c --arg sha "$GITHUB_SHA" \
              '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")] | sort_by(.created_at) | last // empty' \
              <<< "$runs")"

            if [[ -z "$run" ]]; then
              echo "Waiting for ordinary CI push run for ${GITHUB_SHA} (${attempt}/120)"
              sleep 15
              continue
            fi

            status="$(jq -r '.status' <<< "$run")"
            conclusion="$(jq -r '.conclusion // ""' <<< "$run")"
            url="$(jq -r '.html_url' <<< "$run")"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "Ordinary CI succeeded for ${GITHUB_SHA}: ${url}"
                exit 0
              fi
              case "$conclusion" in
                failure|cancelled|action_required|timed_out|startup_failure|stale)
                  echo "Ordinary CI concluded ${conclusion} for ${GITHUB_SHA}: ${url}" >&2
                  exit 1
                  ;;
                *)
                  echo "Ordinary CI completed without success (${conclusion:-unknown}) for ${GITHUB_SHA}: ${url}" >&2
                  exit 1
                  ;;
              esac
            fi
            echo "Ordinary CI is ${status} for ${GITHUB_SHA}: ${url} (${attempt}/120)"
            sleep 15
          done
          echo "Timed out after 30 minutes waiting for successful ordinary CI for ${GITHUB_SHA}" >&2
          exit 1

      - name: Require successful manual quality run for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs" \
            -f event=workflow_dispatch \
            -f head_sha="$GITHUB_SHA" \
            -f per_page=100)"
          run="$(jq -c --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch" and .status == "completed" and .conclusion == "success")] | sort_by(.created_at) | last // empty' \
            <<< "$runs")"
          if [[ -z "$run" ]]; then
            echo "No successful Manual Quality run exists for release commit ${GITHUB_SHA}." >&2
            echo "Run quality.yml manually for this exact commit before releasing." >&2
            exit 1
          fi
          echo "Manual quality accepted: $(jq -r '.html_url' <<< "$run")"

  build:
    name: Package ${{ matrix.target }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust 1.90
        uses: dtolnay/rust-toolchain@0176485ebe2f605bde554dd99f804beeaf7db3e2 # 1.90.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          key: release-${{ matrix.target }}

      - name: Build shipped binaries
        shell: bash
        run: >-
          cargo build --locked --release --target ${{ matrix.target }}
          -p aden-cli -p aden-mcp

      - name: Smoke-test built binaries
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          [[ "${{ runner.os }}" == "Windows" ]] && suffix=".exe"
          "target/${{ matrix.target }}/release/aden${suffix}" --version
          "target/${{ matrix.target }}/release/aden-mcp${suffix}" --version

      - name: Stage shipped binaries
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          [[ "${{ runner.os }}" == "Windows" ]] && suffix=".exe"
          mkdir staged
          cp "target/${{ matrix.target }}/release/aden${suffix}" staged/
          cp "target/${{ matrix.target }}/release/aden-mcp${suffix}" staged/

      - name: Upload native binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.target }}
          path: staged/
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package ${{ matrix.target }}
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - target: x86_64-apple-darwin
            archive_ext: tar.gz
          - target: aarch64-apple-darwin
            archive_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            archive_ext: zip
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download native binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries-${{ matrix.target }}
          path: staged

      - name: Create deterministic self-contained archive
        shell: bash
        env:
          ADEN_RELEASE_BINARY_DIR: ${{ github.workspace }}/staged
        run: >-
          bash scripts/package-release.sh
          "${{ matrix.target }}"
          "${{ needs.validate.outputs.version }}"
          dist

      - name: Validate archive structure and checksums
        shell: bash
        run: >-
          bash scripts/test-release-bundle.sh
          "dist/aden-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          "${{ matrix.target }}"
          "${{ needs.validate.outputs.version }}"

      - name: Attest archive provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/aden-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_ext }}

      - name: Upload verified archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: |
            dist/aden-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_ext }}
            dist/aden-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_ext }}.sha256
          if-no-files-found: error
          retention-days: 7

  consume:
    name: Install ${{ matrix.target }} archive
    needs: [validate, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - runner: macos-14
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive_ext: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download packaged archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist

      - name: Extract, smoke, and install (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          archive="dist/aden-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          mkdir extracted installed
          tar -xzf "$archive" -C extracted
          bundle="$(find extracted -mindepth 1 -maxdepth 1 -type d -name 'aden-*' -print -quit)"
          test -n "$bundle"
          "$bundle/aden" --version
          "$bundle/aden-mcp" --version
          "$bundle/install.sh" --install-dir "$PWD/installed"
          "$PWD/installed/aden" --version
          "$PWD/installed/aden-mcp" --version

      - name: Extract, smoke, and install (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "dist/aden-v${{ needs.validate.outputs.version }}-${{ matrix.target }}.${{ matrix.archive_ext }}"
          Expand-Archive -Path $archive -DestinationPath extracted
          $bundle = Get-ChildItem extracted -Directory | Select-Object -First 1
          if (-not $bundle) { throw "Archive has no bundle directory" }
          & "$($bundle.FullName)/aden.exe" --version
          & "$($bundle.FullName)/aden-mcp.exe" --version
          & "$($bundle.FullName)/install.ps1" -InstallDir "$PWD/installed"
          & "$PWD/installed/aden.exe" --version
          & "$PWD/installed/aden-mcp.exe" --version

  publish:
    name: Publish draft GitHub Release
    if: github.event_name == 'push'
    needs: [validate, consume]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download verified archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create aggregate checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -printf '%f\n' \
            | LC_ALL=C sort \
            | xargs sha256sum > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 5
          sha256sum --check SHA256SUMS

      - name: Attest checksum manifest provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/SHA256SUMS

      - name: Create or refresh draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to replace published release ${RELEASE_TAG}" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              dist/*.tar.gz dist/*.zip dist/*.sha256 dist/SHA256SUMS \
              --verify-tag \
              --draft \
              --generate-notes \
              --title "Aden $RELEASE_TAG"
          fi

  dry-run-summary:
    name: Dry-run summary
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, consume]
    runs-on: ubuntu-24.04
    steps:
      - name: Report result
        run: |
          echo "Release archives for v${{ needs.validate.outputs.version }} were built, installed, smoked, and attested."
          echo "This workflow_dispatch run intentionally did not create a GitHub Release."
