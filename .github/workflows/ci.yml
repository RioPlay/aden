name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lean-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-contracts:
    name: MCP/path contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Setup Rust 1.90
        uses: dtolnay/rust-toolchain@0176485ebe2f605bde554dd99f804beeaf7db3e2 # 1.90.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      # Identity hygiene once per OS matrix row is cheap and keeps Windows/macOS
      # checkouts honest too (author metadata + Cargo authors contract).
      - name: Maintainer identity hygiene
        shell: bash
        env:
          IDENTITY_FORBIDDEN_PATTERNS: ${{ secrets.IDENTITY_FORBIDDEN_PATTERNS }}
        run: bash scripts/check-identity-hygiene.sh --all

      # Cross-platform gate: path/MCP contracts plus product CLI/MCP gauntlets.
      # Catches drive-letter, UNC, separator, install, and argv drift without a
      # full workspace test matrix on every OS.
      - name: Test MCP and filesystem contracts
        run: cargo build --locked -p aden-cli -p aden-mcp && cargo test --locked -p aden-mcp -p aden-paths

      - name: Product CLI gauntlet, cli_tests, and regression lock
        run: >
          cargo test --locked -p aden-cli
          --test low_friction_gauntlet
          --test cli_tests
          --test regression_lock

      - name: Live MCP product gauntlet
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            export ADEN_BIN="${GITHUB_WORKSPACE}/target/debug/aden.exe"
          else
            export ADEN_BIN="${GITHUB_WORKSPACE}/target/debug/aden"
          fi
          test -f "$ADEN_BIN"
          cargo test --locked -p aden-mcp --test mcp_live_gauntlet -- --nocapture

      - name: Smoke source PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $destination = Join-Path $env:RUNNER_TEMP "aden source install"
          .\install.ps1 -InstallDir $destination -Force
          & (Join-Path $destination "aden.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Installed aden.exe smoke check failed" }
          & (Join-Path $destination "aden-mcp.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "Installed aden-mcp.exe smoke check failed" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -InstallDir $destination -Force
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 source install failed" }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 -InstallDir $destination -Uninstall
          if ($LASTEXITCODE -ne 0) { throw "Windows PowerShell 5.1 source uninstall failed" }
          if ((Test-Path -LiteralPath (Join-Path $destination "aden.exe")) -or
              (Test-Path -LiteralPath (Join-Path $destination "aden-mcp.exe"))) {
            throw "Source installer uninstall left binaries behind"
          }

  build:
    name: Build shipped binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust 1.90
        uses: dtolnay/rust-toolchain@0176485ebe2f605bde554dd99f804beeaf7db3e2 # 1.90.0

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Verify frozen regression definitions
        run: cargo test --locked -p aden-cli --test regression_lock

      - name: Build shipped binaries
        run: cargo build --locked --release -p aden-cli -p aden-mcp

      - name: Run workspace regression tests
        run: cargo test --locked --workspace --exclude aden-lsp --no-fail-fast

      - name: Smoke release binary contracts
        shell: bash
        run: |
          set -euo pipefail
          target/release/aden --version
          target/release/aden-mcp --version
          # Release notes promise AmpCode MCP enrollment; prove the shipped CLI
          # still recognizes the platform without writing any user configuration.
          target/release/aden mcp install --platform amp --scope user --surface essential --dry-run >/dev/null
          repo="$(mktemp -d)"
          mkdir -p "$repo/src"
          printf 'pub fn entry_point() {}\n' > "$repo/src/lib.rs"
          git -C "$repo" init -q
          git -C "$repo" config user.email ci@example.invalid
          git -C "$repo" config user.name CI
          git -C "$repo" add .
          git -C "$repo" commit -qm fixture
          target/release/aden ask --strict --budget 512 "Where is entry_point?" "$repo" \
            | jq -e '.schema_version == 1 and (.context | length > 0)'
          target/release/aden ask --human --strict --budget 512 "Where is entry_point?" "$repo" \
            | grep -q 'entry_point'

          # Release-profile product gauntlet (debug gauntlets already run on the
          # multi-OS platform matrix).
          cargo test --locked --release -p aden-cli --test low_friction_gauntlet -- --nocapture
          ADEN_BIN="${GITHUB_WORKSPACE}/target/release/aden" \
            cargo test --locked --release -p aden-mcp --test mcp_live_gauntlet -- --nocapture
