name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Deep quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so identity hygiene can scan author/committer metadata.
          fetch-depth: 0

      - name: Setup Rust 1.90
        uses: dtolnay/rust-toolchain@0176485ebe2f605bde554dd99f804beeaf7db3e2 # 1.90.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Maintainer identity hygiene
        shell: bash
        env:
          # Optional secret: newline-separated fixed strings that must never
          # reappear in tracked files. Leave unset to skip content matching.
          IDENTITY_FORBIDDEN_PATTERNS: ${{ secrets.IDENTITY_FORBIDDEN_PATTERNS }}
        run: bash scripts/check-identity-hygiene.sh --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check and lint every target and feature at MSRV
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo clippy --locked -p aden-lsp --all-targets -- -D warnings

      - name: Setup current stable for opt-in features
        if: github.event_name != 'pull_request'
        run: rustup toolchain install stable --profile minimal

      - name: Check every opt-in feature
        if: github.event_name != 'pull_request'
        run: cargo +stable check --locked --workspace --exclude aden-lsp --all-features

      - name: Verify offline harnesses
        run: |
          # Offline eval/roadmap harness unit tests remain Python for now.
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Viewer behavior and security regressions
        run: |
          node --version
          node --test scripts/test_viewer.cjs scripts/test_simple_viewer.cjs

      - name: Detect editor extension changes
        id: vscode_changes
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          base_ref="${{ github.base_ref }}"
          if ! git rev-parse --verify "origin/${base_ref}" >/dev/null 2>&1; then
            git fetch --no-tags --depth=1 origin "${base_ref}:refs/remotes/origin/${base_ref}"
          fi
          if [[ -n "$(git diff --name-only "origin/${base_ref}...HEAD" -- editors/vscode/)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check editor dependencies and compilation
        if: github.event_name != 'pull_request' || steps.vscode_changes.outputs.changed == 'true'
        working-directory: editors/vscode
        run: |
          npm ci --ignore-scripts
          npm run compile
          npm test
          npm audit --audit-level=low

      - name: Validate documentation and roadmap contracts
        run: |
          cargo run --locked -p aden-cli -- --human check . --severity Forbid
          python3 scripts/validate_roadmap.py

      - name: Assert default dependency tree stays slim
        shell: bash
        run: |
          set -euo pipefail
          forbidden="ureq ureq-proto rustls ring tar zstd fjall lsm-tree"
          tree="$(cargo tree --locked -p aden-cli --edges normal --prefix none | awk '{print $1}' | sort -u)"
          for dependency in $forbidden; do
            if grep -ixq "$dependency" <<< "$tree"; then
              echo "Default dependency tree contains forbidden dependency: $dependency" >&2
              exit 1
            fi
          done

      - name: Install prebuilt cargo-deny
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          curl -fsSL \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.8/cargo-deny-0.19.8-x86_64-unknown-linux-musl.tar.gz" \
            -o "$tmp/cargo-deny.tar.gz"
          echo "70e769ae3872e34d45132b17040859175e11401dc12dddb0303e0b8c7d088f3f  $tmp/cargo-deny.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/cargo-deny.tar.gz" -C "$tmp" --strip-components=1
          install -Dm755 "$tmp/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo-deny --version

      - name: Audit dependencies and vendored assets
        run: |
          cargo deny --workspace --all-features --locked check
          python3 scripts/update_notice.py --check
          (cd crates/aden-cli/assets && sha256sum --check CHECKSUMS)

      - name: Verify source license headers
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r -d '' file; do
            grep -q 'SPDX-License-Identifier' "$file" || { echo "Missing SPDX: $file"; missing=1; }
          done < <(find crates -name '*.rs' -print0)
          while IFS= read -r -d '' file; do
            grep -q 'SPDX-License-Identifier' "$file" || { echo "Missing SPDX: $file"; missing=1; }
          done < <(find scripts release -type f \( -name '*.sh' -o -name '*.ps1' -o -name '*.py' \) -print0)
          test "$missing" -eq 0

      - name: Write quality verdict
        if: always()
        env:
          QUALITY_RESULT: ${{ job.status }}
        run: |
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg result "$QUALITY_RESULT" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{schema_version:1, commit:$commit, result:$result, workflow_run:$run_id}' \
            > quality-verdict.json

      - name: Upload quality verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-verdict-${{ github.sha }}
          path: quality-verdict.json
          if-no-files-found: error
          retention-days: 30
