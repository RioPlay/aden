name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Deep quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so identity hygiene can scan author/committer metadata.
          fetch-depth: 0

      - name: Setup Rust 1.90
        uses: dtolnay/rust-toolchain@0176485ebe2f605bde554dd99f804beeaf7db3e2 # 1.90.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Maintainer identity hygiene
        shell: bash
        env:
          # Optional secret: newline-separated fixed strings that must never
          # reappear in tracked files. Leave unset to skip content matching.
          IDENTITY_FORBIDDEN_PATTERNS: ${{ secrets.IDENTITY_FORBIDDEN_PATTERNS }}
        run: bash scripts/check-identity-hygiene.sh --all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check shipped surface at MSRV
        run: cargo check --locked --workspace --all-targets

      - name: Setup current stable for opt-in features
        run: rustup toolchain install stable --profile minimal

      - name: Check every opt-in feature
        run: cargo +stable check --locked --workspace --exclude aden-lsp --all-features

      - name: Lint workspace
        run: cargo clippy --locked --workspace -- -D warnings

      - name: Verify offline harnesses
        run: |
          # Offline eval/roadmap harness unit tests remain Python for now.
          python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Viewer behavior and security regressions
        run: |
          node --version
          node --test scripts/test_viewer.cjs scripts/test_simple_viewer.cjs

      - name: Validate documentation and roadmap contracts
        run: |
          cargo run --locked -p aden-cli -- --human check . --severity Forbid
          python3 scripts/validate_roadmap.py

      - name: Assert default dependency tree stays slim
        shell: bash
        run: |
          set -euo pipefail
          forbidden="ureq ureq-proto rustls ring tar zstd"
          tree="$(cargo tree --locked -p aden-cli --edges normal --prefix none | awk '{print $1}' | sort -u)"
          for dependency in $forbidden; do
            if grep -ixq "$dependency" <<< "$tree"; then
              echo "Default dependency tree contains opt-in dependency: $dependency" >&2
              exit 1
            fi
          done

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.8 --locked

      - name: Audit dependencies and vendored assets
        run: |
          cargo deny --workspace --all-features --locked check
          python3 scripts/update_notice.py --check
          (cd crates/aden-cli/assets && sha256sum --check CHECKSUMS)

      - name: Verify source license headers
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r -d '' file; do
            grep -q 'SPDX-License-Identifier' "$file" || { echo "Missing SPDX: $file"; missing=1; }
          done < <(find crates -name '*.rs' -print0)
          while IFS= read -r -d '' file; do
            grep -q 'SPDX-License-Identifier' "$file" || { echo "Missing SPDX: $file"; missing=1; }
          done < <(find scripts release -type f \( -name '*.sh' -o -name '*.ps1' -o -name '*.py' \) -print0)
          test "$missing" -eq 0

      - name: Write quality verdict
        if: always()
        env:
          QUALITY_RESULT: ${{ job.status }}
        run: |
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg result "$QUALITY_RESULT" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{schema_version:1, commit:$commit, result:$result, workflow_run:$run_id}' \
            > quality-verdict.json

      - name: Upload quality verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-verdict-${{ github.sha }}
          path: quality-verdict.json
          if-no-files-found: error
          retention-days: 30
