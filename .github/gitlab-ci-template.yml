# Aden Check — GitLab CI Template
# Drop this into .gitlab-ci.yml to enable Aden context gates.

variables:
  ADEN_VERSION: "0.1.0"
  ADEN_LANGUAGES: "rust,python,typescript,javascript,go"
  ADEN_GATES: "check,heal"

stages:
  - context

aden-check:
  stage: context
  image: rust:latest
  before_script:
    - curl -fsSL https://rioplay.dev/install | bash
    - export PATH="$HOME/.local/bin:$PATH"
    - aden init
  script:
    - aden gen . --out-dir contracts/
    - aden check .
  artifacts:
    paths:
      - contracts/
    expire_in: 1 week

# Optional: heal gate (non-blocking proposal review)
aden-heal:
  stage: context
  image: rust:latest
  allow_failure: true
  before_script:
    - curl -fsSL https://rioplay.dev/install | bash
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - aden heal --scan . --propose
  artifacts:
    paths:
      - .aden/proposals/
    expire_in: 1 week
