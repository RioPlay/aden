# cargo-deny configuration — license and source policy for Aden.
# Run: cargo deny check
# CI: see .github/workflows/ci.yml (license-check job)

[graph]
# Exclude dev-only targets from the analysis — they never ship in the binary.
exclude-dev = false

[licenses]
# Permissive licenses unconditionally accepted.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "0BSD",
    "ISC",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "CDLA-Permissive-2.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT OR Zlib OR Apache-2.0",
    "Zlib OR Apache-2.0 OR MIT",
]

# Copyleft / weak-copyleft licenses: require explicit per-crate exceptions.
# Adding a new MPL/GPL dep without an exception here blocks the build.
exceptions = [
    # self_cell: Apache-2.0 OR GPL-2.0-only — used under Apache-2.0 branch.
    { allow = ["Apache-2.0 OR GPL-2.0-only"], name = "self_cell" },
    # option-ext: MPL-2.0 — file-level copyleft, used unmodified.
    { allow = ["MPL-2.0"], name = "option-ext" },
    # dyn-eq: MPL-2.0 — dense-feature-only transitive via tract ONNX stack.
    { allow = ["MPL-2.0"], name = "dyn-eq" },
]

# Confidence threshold for license detection from file text.
confidence-threshold = 0.8

[sources]
# Only crates.io and the project's own path dependencies are allowed.
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# Deny crates with known security advisories in the RustSec database.
ignore = []
