[package]
name = "aden-index"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
aden-core = { path = "../aden-core" }
aden-paths = { path = "../aden-paths" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.0"
rayon.workspace = true
rust-stemmers = "1.0"
# Optional dense-embedding stack (hybrid retrieval), behind the `dense` feature so
# the default build stays lean. tract-onnx = pure-Rust ONNX inference
# (Apache-2.0 OR MIT, no native runtime, deterministic); kitoken = pure-Rust
# WordPiece tokenizer (BSD-2-Clause) that loads the model's tokenizer.json directly.
# Replaced HuggingFace `tokenizers` to drop its `paste` dep (RUSTSEC-2024-0436) and
# its C/C++ build deps; byte-identical token ids are pinned by
# tests/tokenizer_parity.rs. See crates/aden-index/src/dense.rs.
tract-onnx = { version = "0.23", optional = true }
kitoken = { version = "0.11", optional = true, default-features = false, features = ["std", "normalization", "convert-tokenizers"] }

[features]
# Local ONNX embedding provider (TractEmbedder) for hybrid retrieval.
dense = ["dep:tract-onnx", "dep:kitoken"]

[dev-dependencies]
criterion = "0.8"
tempfile = "3.27.0"
# Cross-platform home-dir resolution for eval-harness tests (no $HOME on Windows).
dirs = "6"

[[bench]]
name = "covering_postings"
harness = false
