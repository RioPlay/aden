[package]
name = "aden-index"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
aden-core = { path = "../aden-core" }
aden-paths = { path = "../aden-paths" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.0"
rayon.workspace = true
rust-stemmers = "1.0"
# Optional dense-embedding stack (hybrid retrieval), behind the `dense` feature so
# the default build stays lean. tract-onnx = pure-Rust ONNX inference
# (Apache-2.0 OR MIT, no native runtime, deterministic); tokenizers = HuggingFace
# tokenizers (Apache-2.0), default-features off to avoid the native `onig` C lib.
# See crates/aden-index/src/dense.rs. Subject to the license verification pass.
tract-onnx = { version = "0.23", optional = true }
tokenizers = { version = "0.23", optional = true, default-features = false, features = ["fancy-regex"] }

[features]
# Local ONNX embedding provider (TractEmbedder) for hybrid retrieval.
dense = ["dep:tract-onnx", "dep:tokenizers"]

[dev-dependencies]
tempfile = "3.27.0"
