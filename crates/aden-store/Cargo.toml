[package]
name = "aden-store"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Aden: Storage abstraction layer for the knowledge graph"

[dependencies]
aden-core = { path = "../aden-core" }
aden-emit = { path = "../aden-emit" }
postcard = { version = "1.0", default-features = false, features = ["alloc"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
# SQLite 3 (WAL mode, static bundled amalgamation) + pure-Rust lz4_flex for
# fast, compact, multi-reader concurrent storage with sub-millisecond cold opens.
rusqlite = { version = "0.43", default-features = false, features = ["bundled", "cache"] }
lz4_flex = { version = "0.14", default-features = false, features = ["alloc", "safe-encode", "safe-decode", "checked-decode"] }

[dev-dependencies]
uuid = { version = "1.12", features = ["v4", "serde"] }
