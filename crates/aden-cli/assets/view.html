<title>aden · graph</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(1200px 800px at 70% -10%, #141a26 0%, #0b0e14 60%);
    color: #cdd6f4; font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  #graph { position: fixed; inset: 0; }
  #hdr { position: fixed; left: 14px; top: 12px; font-weight: 600; letter-spacing: .04em;
    color: #b4befe; text-shadow: 0 0 18px rgba(137,180,250,.35); pointer-events: none; }
  #hdr small { color: #6c7086; font-weight: 400; letter-spacing: 0; }
  #fit { position: fixed; left: 132px; top: 9px; z-index: 6; cursor: pointer; user-select: none;
    background: rgba(17,21,30,.9); border: 1px solid #313244; border-radius: 8px; padding: 4px 11px;
    color: #a6adc8; font-size: 12px; }
  #fit:hover { border-color: #89b4fa; color: #cdd6f4; }
  /* 'h' hides all chrome for a clean graph */
  body.hideui #hdr, body.hideui #fit, body.hideui #search, body.hideui #replaybar,
  body.hideui #filter, body.hideui #hint, body.hideui #back, body.hideui #panel {
    opacity: 0 !important; pointer-events: none; }
  /* collapsible side panel */
  #pcollapse { float: right; cursor: pointer; color: #6c7086; font-size: 13px; line-height: 1; padding: 2px 4px; }
  #pcollapse:hover { color: #cdd6f4; }
  #panel.collapsed { padding-bottom: 12px; }
  #panel.collapsed #p-body, #panel.collapsed #pback { display: none; }
  #panel.collapsed #p-title { margin-bottom: 0; }
  #hint { position: fixed; left: 14px; bottom: 12px; color: #585b70; pointer-events: none; }
  #back { position: fixed; left: 14px; top: 34px; display: none; cursor: pointer; color: #89b4fa;
    background: rgba(17,21,30,.7); border: 1px solid #313244; border-radius: 6px; padding: 3px 10px; }
  #back:hover { background: rgba(137,180,250,.14); }
  #panel { position: fixed; top: 0; right: 0; width: 330px; max-height: 100%; overflow: auto;
    background: rgba(17,21,30,.90); border-left: 1px solid #1f2430; padding: 16px 18px;
    backdrop-filter: blur(8px); transform: translateX(102%); transition: transform .26s cubic-bezier(.2,.7,.2,1);
    box-shadow: -20px 0 60px rgba(0,0,0,.35); }
  #panel.open { transform: none; }
  #panel h2 { margin: 0 0 10px; font-size: 14px; color: #89b4fa; word-break: break-all; line-height: 1.3; }
  #panel .k { color: #6c7086; }
  #panel .row { margin: 5px 0; word-break: break-all; }
  #panel .sec { margin-top: 12px; color: #9399b2; font-weight: 600; border-top: 1px solid #1f2430; padding-top: 10px; }
  #panel .nb { color: #a6adc8; cursor: pointer; border-radius: 4px; padding: 2px 5px; margin: 1px -5px; }
  #panel .nb:hover { background: rgba(137,180,250,.13); color: #cdd6f4; }
  #panel .nb.sel { background: rgba(137,180,250,.2); color: #cdd6f4; outline: 1px solid rgba(137,180,250,.35); }
  #pback { display: none; cursor: pointer; color: #89b4fa; font-size: 12px; margin-bottom: 8px; }
  #pback:hover { text-decoration: underline; }
  #search { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); width: 340px; z-index: 5; }
  #q { width: 100%; box-sizing: border-box; background: rgba(17,21,30,.92); border: 1px solid #313244;
    border-radius: 8px; padding: 8px 12px; color: #cdd6f4; font: 13px ui-sans-serif, system-ui, sans-serif;
    outline: none; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  #q:focus { border-color: #89b4fa; }
  #results { margin-top: 5px; background: rgba(17,21,30,.97); border: 1px solid #313244; border-radius: 8px;
    overflow: hidden; display: none; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  #results.open { display: block; }
  #results .r { padding: 6px 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #results .r:hover, #results .r.sel { background: rgba(137,180,250,.16); }
  #results .r .k { color: #6c7086; }
  #filter { position: fixed; left: 14px; bottom: 36px; display: flex; flex-wrap: wrap; gap: 5px; max-width: 56%; z-index: 4; }
  #filter .chip { font-size: 11px; padding: 3px 9px 3px 8px; border-radius: 999px; cursor: pointer; user-select: none;
    background: rgba(17,21,30,.85); border: 1px solid #313244; color: #9399b2; }
  #filter .chip.on { color: #cdd6f4; background: rgba(255,255,255,.05); }
  #filter .chip .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
  #replaybar { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 5;
    display: flex; align-items: center; gap: 11px; background: rgba(17,21,30,.92); border: 1px solid #313244;
    border-radius: 999px; padding: 7px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  #play { cursor: pointer; color: #a6e3a1; font-size: 12px; user-select: none; white-space: nowrap; }
  #play:hover { color: #b9f0b0; }
  #scrub { width: 230px; }
  #speed { width: 74px; }
  #rcount { color: #9399b2; font: 11px ui-monospace, monospace; min-width: 92px; white-space: nowrap; text-align: right; }
  input[type=range] { accent-color: #89b4fa; cursor: pointer; height: 4px; }
  #act { position: fixed; bottom: 74px; left: 50%; transform: translateX(-50%); z-index: 5; display: none;
    color: #cdd6f4; font: 12px ui-monospace, monospace; background: rgba(17,21,30,.88); padding: 5px 13px;
    border: 1px solid #313244; border-radius: 7px; white-space: nowrap; max-width: 70vw; overflow: hidden; text-overflow: ellipsis; }
  /* dark, consistent hover tooltip (force-graph injects .graph-tooltip) */
  .graph-tooltip { background: rgba(17,21,30,.96) !important; color: #cdd6f4 !important;
    border: 1px solid #313244; border-radius: 6px; padding: 5px 9px !important;
    font: 12px ui-sans-serif, system-ui, sans-serif !important; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .graph-tooltip b { color: #89b4fa; }
</style>
</head>
<body>
<div id="hdr">aden <small>· graph</small></div>
<div id="fit" onclick="fitAll()" title="fit full view (f / esc / click empty space)">⊙ fit</div>
<div id="back" onclick="showOverview()">← communities</div>
<div id="search"><input id="q" type="text" placeholder="search symbols…  ( / )" autocomplete="off" spellcheck="false"><div id="results"></div></div>
<div id="graph"></div>
<div id="act"></div>
<div id="replaybar">
  <span id="play" onclick="togglePlay()">▶ replay</span>
  <input id="scrub" type="range" min="0" max="0" value="0" oninput="scrubTo(+this.value)" title="scrub history">
  <input id="speed" type="range" min="1" max="12" value="6" oninput="setSpeed(+this.value)" title="replay speed">
  <span id="rcount"></span>
</div>
<div id="filter"></div>
<div id="panel"><span id="pcollapse" onclick="togglePanel()" title="collapse / expand">▾</span><div id="pback" onclick="panelBack()">← back</div><h2 id="p-title"></h2><div id="p-body"></div></div>
<div id="hint">/ search · ↑↓+enter walk · backspace back · f fit · h hide UI · o open in editor · right-click = editor</div>
<script>/*FORCE_GRAPH_LIB*/</script>
<script>
const DATA = /*ADEN_DATA*/;
const EDITOR = "/*EDITOR*/";
const hasDrill = !!(DATA.drill && Object.keys(DATA.drill).length);
let byId = {}, curLinks = [], level = 'overview';
// Hover/focus highlight state (node + its neighbours + their links).
const highlightNodes = new Set(), highlightLinks = new Set();
let hoverNode = null;
// Panel navigation history (walk node→node, ← back / Backspace to return).
let panelStack = [], panelCur = null, panelNbs = [], nbSel = -1;
let activeTypes = new Set();   // visible edge types (filter chips)
// Activity replay: pulse nodes as an agent "touches" them.
let playing = false, actSeq = [], actIdx = 0, playTimer = null, pulseRAF = null;
let anchorToId = {};           // map a real activity log's anchors → current node ids
let growMode = false, stepMs = 600;   // replay grows the graph; nodes revealed as touched
const pulses = new Map();      // node id → pulse strength (1 → 0, fading glow)
const revealed = new Set();    // node ids made visible so far during replay
const REL = 3;
function nodeSize(n) { return n.size != null ? Math.min(2 + Math.sqrt(n.size), 12) : 1 + Math.min(Math.sqrt(n.deg), 3); }
function hexA(hex, a) { const m = hex.replace('#',''); return `rgba(${parseInt(m.slice(0,2),16)},${parseInt(m.slice(2,4),16)},${parseInt(m.slice(4,6),16)},${a})`; }
// "Open in editor": a custom-scheme URI the OS routes to the desktop app.
function editorUrl(n) { return (n && n.file) ? EDITOR.replace('{file}', n.file).replace('{line}', n.line || 1) : null; }
function openEditor(n) { const u = editorUrl(n); if (u) window.location.href = u; }

// Perceptually-spaced palette (Catppuccin). Nodes are coloured by subsystem
// (module/crate) for instant structure, communities for the overview.
const palette = ['#89b4fa','#a6e3a1','#fab387','#cba6f7','#94e2d5','#f9e2af',
                 '#eba0ac','#74c7ec','#b4befe','#f5c2e7','#f2cdcd','#f38ba8',
                 '#89dceb','#a6e3a1','#fab387'];
let groupIdx = {};   // subsystem name → stable palette index (set in buildData)
let typeColor = {};  // edge relationship type → colour (set in buildData)
// Distinct edge palette (kept separate from the node hues so lines ≠ nodes).
const edgePalette = ['#89b4fa','#f38ba8','#a6e3a1','#fab387','#cba6f7','#94e2d5',
                     '#f9e2af','#74c7ec','#eba0ac','#b4befe','#f5c2e7','#89dceb'];
function colorOf(n) {
  if (n.root) return '#f38ba8';                                           // the focused node
  if (n.group != null && n.group in groupIdx) return palette[groupIdx[n.group] % palette.length];
  if (n.community != null) return palette[n.community % palette.length];  // overview super-nodes
  return '#89b4fa';
}
const idOf = e => (e && e.id != null) ? e.id : e;
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c])); }
function row(k, v) { return `<div class="row"><span class="k">${k}:</span> ${esc(v)}</div>`; }
// The "actual call" / original function name — the symbol, truncated from its anchor.
function shortName(n) { const a = n.label || n.anchor || n.id || ''; return String(a).split('#').pop().split('/').pop(); }
// File/group context (everything before the symbol) for the tooltip subtitle.
function context(n) { if (n.size != null) return n.size + ' symbols'; const a = n.anchor || ''; const h = a.indexOf('#'); return (h >= 0 ? a.slice(0, h) : '').split('/').pop(); }

// Adapt aden's {nodes, edges} to force-graph {nodes, links} + per-view degree/index.
function buildData(rawNodes, rawEdges) {
  byId = {};
  const nodes = (rawNodes || []).map(n => { const c = { ...n, neighbors: [], adj: [] }; byId[n.id] = c; return c; });
  const links = (rawEdges || []).map(e => ({ source: e.from, target: e.to, type: e.type }));
  // Pre-compute neighbours + incident links per node (for hover highlighting).
  links.forEach(l => {
    const a = byId[l.source], b = byId[l.target];
    if (a && b) { a.neighbors.push(b); b.neighbors.push(a); a.adj.push(l); b.adj.push(l); }
  });
  nodes.forEach(n => n.deg = n.adj.length);
  anchorToId = {}; nodes.forEach(n => { if (n.anchor) anchorToId[n.anchor] = n.id; });
  // stable subsystem → colour index (sorted, so colours don't shuffle per run)
  const gs = [...new Set(nodes.map(n => n.group).filter(g => g != null))].sort();
  groupIdx = {}; gs.forEach((g, i) => { groupIdx[g] = i; });
  // stable relationship-type → colour (sorted, so the legend is consistent)
  const ets = [...new Set(links.map(l => l.type))].sort();
  typeColor = {}; ets.forEach((t, i) => { typeColor[t] = edgePalette[i % edgePalette.length]; });
  highlightNodes.clear(); highlightLinks.clear(); hoverNode = null;
  activeTypes = new Set(links.map(l => l.type));   // all edge types visible by default
  curLinks = links;
  return { nodes, links };
}

const el = document.getElementById('graph');
const Graph = ForceGraph()(el)
  .backgroundColor('rgba(0,0,0,0)')
  .nodeId('id')
  .autoPauseRedraw(false)                 // keep repainting so hover highlight is live
  .nodeLabel(n => `<b>${esc(shortName(n))}</b>${context(n) ? ` <span style="color:#6c7086">${esc(context(n))}</span>` : ''}`)
  .nodeRelSize(REL)
  .nodeVal(nodeSize)
  // Dim non-highlighted nodes when something is focused (focus + context).
  // Gentle de-emphasis (no harsh blackout) so the focus change isn't a flash.
  .nodeColor(n => (highlightNodes.size && !highlightNodes.has(n)) ? hexA(colorOf(n), .34) : colorOf(n))
  .nodeCanvasObjectMode(() => 'before')
  .nodeCanvasObject((n, ctx, scale) => {
    const base = REL * Math.sqrt(nodeSize(n));
    const dim = highlightNodes.size && !highlightNodes.has(n);
    if (!dim) {                           // soft colour glow behind each node (premium look)
      ctx.beginPath(); ctx.arc(n.x, n.y, base * 2.1, 0, 2 * Math.PI);
      ctx.fillStyle = hexA(colorOf(n), 0.10); ctx.fill();
    }
    const p = pulses.get(n.id);
    if (p > 0) {                          // expanding fading glow = "being touched"
      ctx.beginPath(); ctx.arc(n.x, n.y, base * (1.5 + (1 - p) * 3), 0, 2 * Math.PI);
      ctx.fillStyle = `rgba(166,227,161,${0.4 * p})`;
      ctx.fill();
    }
    if (n === hoverNode) {                // steady focus halo
      ctx.beginPath(); ctx.arc(n.x, n.y, base * 1.7, 0, 2 * Math.PI);
      ctx.fillStyle = 'rgba(137,180,250,.22)'; ctx.fill();
    }
    // Always label spheres + hubs (and the hovered node), so the map is readable
    // without hovering everything. Others stay tooltip-only to avoid clutter.
    if (!dim && (n.size != null || n === hoverNode || (scale > 1.6 && n.deg >= 5))) {
      const fs = Math.max(11 / scale, 1.5);
      ctx.font = `${fs}px ui-sans-serif, system-ui, sans-serif`;
      ctx.fillStyle = (n.size != null) ? 'rgba(205,214,244,.92)' : 'rgba(186,194,222,.8)';
      ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText(shortName(n), n.x, n.y + base + 3 / scale);
    }
  })
  .linkColor(l => {
    if (l.member) return highlightLinks.has(l) ? 'rgba(180,190,220,.35)' : 'rgba(120,130,170,.10)';
    const c = typeColor[l.type] || '#8088aa';
    if (highlightLinks.has(l)) return hexA(c, .9);
    if (highlightNodes.size) return hexA(c, .06);
    return hexA(c, .4);
  })
  .linkWidth(l => highlightLinks.has(l) ? 2 : 1)
  .nodeVisibility(n => !growMode || revealed.has(n.id))
  .linkVisibility(l => (l.member || activeTypes.has(l.type)) && (!growMode || (revealed.has(idOf(l.source)) && revealed.has(idOf(l.target)))))
  .linkDirectionalArrowLength(3.5)
  .linkDirectionalArrowRelPos(1)
  .linkLabel(l => l.type)
  .onNodeHover(n => {
    // Sticky highlight: only react to a *genuinely new* node. Ignoring the
    // null/gaps between dense nodes removes the rapid on-off strobing entirely
    // (no animation, no flashing — important on OLED).
    el.style.cursor = n ? 'pointer' : 'default';
    if (!n || n === hoverNode) return;
    highlightNodes.clear(); highlightLinks.clear();
    highlightNodes.add(n); (n.neighbors || []).forEach(x => highlightNodes.add(x)); (n.adj || []).forEach(l => highlightLinks.add(l));
    hoverNode = n;
  })
  .onNodeClick(onClick)
  .onNodeRightClick(n => openEditor(n))
  .onBackgroundClick(() => { document.getElementById('panel').classList.remove('open'); fitAll(); });
el.addEventListener('contextmenu', e => e.preventDefault()); // right-click = open in editor

Graph.d3Force('charge').strength(-110).distanceMax(300);   // localised repulsion → no long-range stretch
const _lf = Graph.d3Force('link'); if (_lf) _lf.distance(l => l.member ? 24 : 34).strength(0.5);
// Lightweight collision so nodes don't overlap (no d3 dep; O(n²) is fine ≤ a few hundred).
function collideForce(radius, strength) {
  let nodes = [];
  const f = (alpha) => {
    const s = strength == null ? 0.8 : strength;
    for (let i = 0; i < nodes.length; i++) {
      const a = nodes[i];
      for (let j = i + 1; j < nodes.length; j++) {
        const b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
        const rr = radius(a) + radius(b);
        if (d2 < rr * rr) {
          if (d2 < 1e-6) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = dx * dx + dy * dy; }
          const d = Math.sqrt(d2), push = (rr - d) / d * s * alpha;
          a.vx -= dx * push; a.vy -= dy * push; b.vx += dx * push; b.vy += dy * push;
        }
      }
    }
  };
  f.initialize = n => { nodes = n; };
  return f;
}
Graph.d3Force('collide', collideForce(n => REL * Math.sqrt(nodeSize(n)) * 1.5 + 6, 1));
let fitPending = false;
Graph.onEngineStop(() => { if (fitPending) { Graph.zoomToFit(600, 70); fitPending = false; } });
function fit() { Graph.width(innerWidth).height(innerHeight); }
addEventListener('resize', fit); fit();

function show(rawNodes, rawEdges) {
  fitPending = true;
  panelStack = []; panelCur = null;
  stopPlay(); pulses.clear(); actSeq = []; actIdx = 0; growMode = false; revealed.clear();
  document.getElementById('act').style.display = 'none';
  document.getElementById('scrub').value = 0;
  document.getElementById('rcount').textContent = '';
  Graph.graphData(buildData(rawNodes, rawEdges));
  syncSearch();
  syncFilter();
  refreshViz();
}
function showOverview() {
  level = 'overview';
  document.getElementById('back').style.display = 'none';
  document.getElementById('panel').classList.remove('open');
  show(DATA.nodes, DATA.edges);
}
function showCommunity(cid, lbl) {
  const d = DATA.drill[cid];
  if (!d) return;
  level = 'community';
  const b = document.getElementById('back');
  b.textContent = '← ' + (lbl || 'communities'); b.style.display = 'block';
  document.getElementById('panel').classList.remove('open');
  show(d.nodes, d.edges);
}
function onClick(n) {
  // A sphere (community super-node: no anchor, has a drill) expands/collapses IN PLACE.
  if (hasDrill && n.anchor == null && DATA.drill[n.id]) { toggleCommunity(n.id); return; }
  navTo(n);
}

// ── Nested view: expand/collapse a sphere into its functions, in place ──
function rebuildAdj(nodes, links) {
  byId = {};
  nodes.forEach(n => { n.neighbors = []; n.adj = []; byId[n.id] = n; });
  links.forEach(l => { const a = byId[idOf(l.source)], b = byId[idOf(l.target)]; if (a && b) { a.neighbors.push(b); b.neighbors.push(a); a.adj.push(l); b.adj.push(l); } });
  nodes.forEach(n => n.deg = n.adj.length);
}
function recolorMaps(nodes, links) {
  const gs = [...new Set(nodes.map(n => n.group).filter(g => g != null))].sort();
  groupIdx = {}; gs.forEach((g, i) => { groupIdx[g] = i; });
  const ets = [...new Set(links.map(l => l.type).filter(t => t && t !== '·'))].sort();
  typeColor = {}; ets.forEach((t, i) => { typeColor[t] = edgePalette[i % edgePalette.length]; });
  activeTypes = new Set(ets);
  anchorToId = {}; nodes.forEach(n => { if (n.anchor) anchorToId[n.anchor] = n.id; });
}
function applyExplore() {              // reuses existing node objects → positions persist
  const nodes = Object.values(byId);
  rebuildAdj(nodes, curLinks);
  recolorMaps(nodes, curLinks);
  Graph.graphData({ nodes, links: curLinks });
  syncFilter(); refreshViz();
  Graph.d3ReheatSimulation();
}
function expandCommunity(cid) {
  const core = byId[cid], d = DATA.drill[cid];
  if (!core || !d) return;
  core.expanded = true;
  const N = d.nodes.length;
  d.nodes.forEach((m, i) => {           // members born in a ring around the sphere, then fan via force
    const id = cid + ':' + m.id;
    if (byId[id]) return;
    const ang = (i / N) * 2 * Math.PI;
    byId[id] = { ...m, id, x: (core.x || 0) + 30 * Math.cos(ang), y: (core.y || 0) + 30 * Math.sin(ang), neighbors: [], adj: [] };
  });
  d.nodes.forEach(m => curLinks.push({ source: cid, target: cid + ':' + m.id, type: '·', member: true }));
  d.edges.forEach(e => curLinks.push({ source: cid + ':' + e.from, target: cid + ':' + e.to, type: e.type }));
  applyExplore();
}
function collapseCommunity(cid) {
  const core = byId[cid]; if (core) core.expanded = false;
  const pre = cid + ':';
  Object.keys(byId).forEach(id => { if (id.startsWith(pre)) delete byId[id]; });
  curLinks = curLinks.filter(l => !(String(idOf(l.source)).startsWith(pre) || String(idOf(l.target)).startsWith(pre)));
  applyExplore();
}
function toggleCommunity(cid) {
  const core = byId[cid];
  if (core && core.expanded) collapseCommunity(cid); else expandCommunity(cid);
}

function togglePanel() {
  const p = document.getElementById('panel');
  p.classList.toggle('collapsed');
  document.getElementById('pcollapse').textContent = p.classList.contains('collapsed') ? '▸' : '▾';
}
// Snap back to the full view (frame everything visible).
function fitAll() {
  highlightNodes.clear(); highlightLinks.clear(); hoverNode = null;
  Graph.zoomToFit(600, 60, n => !growMode || revealed.has(n.id));
}
// Focus a node: highlight + zoom to *frame its cluster* + panel. The layout itself
// is never disturbed — we only move the camera, so it's clean and reversible.
function goNode(n) {
  panelCur = n.id;
  highlightNodes.clear(); highlightLinks.clear();
  highlightNodes.add(n); (n.neighbors || []).forEach(x => highlightNodes.add(x)); (n.adj || []).forEach(l => highlightLinks.add(l));
  hoverNode = n;
  const ids = new Set([n.id, ...(n.neighbors || []).map(x => x.id)]);
  Graph.zoomToFit(600, 90, x => ids.has(x.id));   // frame just this cluster
  showPanel(n);
}
// Navigate to a node, recording history — so ← back / Backspace returns. Used by
// EVERY focus: graph-node click, panel neighbour click, and search.
function navTo(n) {
  if (panelCur && panelCur !== n.id) panelStack.push(panelCur);
  goNode(n);
}
function focusNode(id) { const n = byId[id]; if (n) navTo(n); }
function panelBack() {
  const prev = panelStack.pop();
  if (prev == null) return;
  const n = byId[prev]; if (n) goNode(n);   // goNode (no push) so we don't re-record
}
// Live preview: hovering/arrow-selecting a neighbour row lights that node up in the
// graph in real time — no panel change, no history. `center` pans gently to it.
function previewNode(id, center) {
  const n = byId[id]; if (!n) return;
  highlightNodes.clear(); highlightLinks.clear();
  highlightNodes.add(n); (n.neighbors || []).forEach(x => highlightNodes.add(x)); (n.adj || []).forEach(l => highlightLinks.add(l));
  hoverNode = n;
  if (center && n.x != null) Graph.centerAt(n.x, n.y, 350);
}
function restoreFocus() {   // back to the panel's current node when the mouse leaves the list
  const n = panelCur && byId[panelCur]; if (!n) return;
  highlightNodes.clear(); highlightLinks.clear();
  highlightNodes.add(n); (n.neighbors || []).forEach(x => highlightNodes.add(x)); (n.adj || []).forEach(l => highlightLinks.add(l));
  hoverNode = n;
}

function showPanel(n) {
  const rows = [];
  if (n.size != null) rows.push(row('symbols', n.size));
  if (n.kind) rows.push(row('kind', n.kind));
  if (n.community != null) rows.push(row('community', n.community));
  rows.push(row('degree', n.deg));
  const nbList = [];
  curLinks.forEach(l => {
    const s = idOf(l.source), t = idOf(l.target);
    if (s !== n.id && t !== n.id) return;
    const o = s === n.id ? t : s;
    nbList.push({ id: o, dir: s === n.id ? '→' : '←', type: l.type });
  });
  panelNbs = nbList.map(x => x.id); nbSel = -1;
  const nbs = nbList.slice(0, 40).map((x, i) =>
    `<div class="row nb" id="nb-${i}" onclick="focusNode('${x.id}')" onmouseenter="previewNode('${x.id}', false)">${x.dir} ${esc(shortName(byId[x.id] || { id: x.id }))} <span class="k">${esc(x.type)}</span></div>`);
  const ed = editorUrl(n);
  document.getElementById('p-title').textContent = shortName(n);
  document.getElementById('p-body').innerHTML =
    (n.anchor ? `<div class="row" style="color:#6c7086; word-break:break-all">${esc(n.anchor)}</div>` : '') +
    rows.join('') +
    (ed ? `<div class="row"><a href="${ed}">open in editor →</a></div>` : '') +
    `<div class="sec">neighbours (${nbList.length})</div>` +
    nbs.join('');
  document.getElementById('pback').style.display = panelStack.length ? 'block' : 'none';
  document.getElementById('panel').classList.add('open');
}

// ── Search within the current view: highlight matches, jump to one ──
const qEl = document.getElementById('q'), resEl = document.getElementById('results');
let matches = [], selIdx = 0;
function runSearch() {
  const q = qEl.value.trim().toLowerCase();
  highlightNodes.clear(); highlightLinks.clear(); hoverNode = null;
  if (!q) { matches = []; resEl.classList.remove('open'); resEl.innerHTML = ''; return; }
  matches = Object.values(byId)
    .filter(n => (shortName(n) + ' ' + (n.anchor || '')).toLowerCase().includes(q))
    .sort((a, b) => shortName(a).length - shortName(b).length)
    .slice(0, 12);
  selIdx = 0;
  resEl.innerHTML = matches.map((n, i) =>
    `<div class="r${i === 0 ? ' sel' : ''}" onclick="pickResult(${i})">${esc(shortName(n))} <span class="k">${esc(context(n) || '')}</span></div>`).join('');
  resEl.classList.toggle('open', matches.length > 0);
  matches.forEach(n => highlightNodes.add(n));   // light up matches, dim the rest
}
function pickResult(i) {
  const n = matches[i]; if (!n) return;
  qEl.value = ''; resEl.classList.remove('open'); matches = [];
  navTo(n);
}
function updateSel() { [...resEl.children].forEach((c, i) => c.classList.toggle('sel', i === selIdx)); }
qEl.addEventListener('input', runSearch);
qEl.addEventListener('keydown', e => {
  if (e.key === 'Escape') { qEl.value = ''; runSearch(); qEl.blur(); return; }
  if (!matches.length) return;
  if (e.key === 'ArrowDown') { selIdx = Math.min(selIdx + 1, matches.length - 1); updateSel(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { selIdx = Math.max(selIdx - 1, 0); updateSel(); e.preventDefault(); }
  else if (e.key === 'Enter') { pickResult(selIdx); e.preventDefault(); }
});
function syncSearch() { if (qEl) { qEl.value = ''; resEl.classList.remove('open'); matches = []; } }

// ── Filter by edge type (chips). Toggling hides/shows those edges live. ──
const filterEl = document.getElementById('filter');
let filterTypes = [];
function renderChips() {                       // chips double as a colour legend for edge types
  filterEl.innerHTML = filterTypes.map(t => {
    const c = typeColor[t] || '#8088aa', on = activeTypes.has(t);
    return `<span class="chip${on ? ' on' : ''}" data-t="${esc(t)}" style="${on ? `border-color:${c}` : ''}" onclick="toggleType('${esc(t)}')"><span class="dot" style="background:${on ? c : '#45475a'}"></span>${esc(t)}</span>`;
  }).join('');
}
function syncFilter() {
  filterTypes = [...new Set(curLinks.filter(l => !l.member).map(l => l.type))].sort();
  renderChips();
}
function toggleType(t) {
  if (activeTypes.has(t)) activeTypes.delete(t); else activeTypes.add(t);
  renderChips(); refreshViz();
}

// ── Activity replay: pulse nodes as they're "touched", in sequence ──
// Frames come from a real log (DATA.activity: [{label, anchors:[...]}…], e.g. git
// history) when present, else a simulated agent walk over the current graph.
function buildActivitySeq() {
  if (Array.isArray(DATA.activity) && DATA.activity.length) {
    return DATA.activity
      .map(f => ({ label: f.label || '', date: f.date || '', ids: (f.anchors || []).map(a => anchorToId[a]).filter(Boolean) }))
      .filter(f => f.ids.length);
  }
  const all = Object.values(byId);
  if (!all.length) return [];
  let cur = all.find(n => n.root) || all.slice().sort((a, b) => b.deg - a.deg)[0];
  const seq = [], visited = new Set(), kinds = ['read', 'query', 'edit', 'read'];
  for (let i = 0; i < Math.min(all.length, 80) && cur; i++) {
    seq.push({ label: kinds[i % 4] + ' · ' + shortName(cur), ids: [cur.id] });
    visited.add(cur.id);
    const nbrs = cur.neighbors || [], fresh = nbrs.filter(x => !visited.has(x.id));
    const pool = fresh.length ? fresh : nbrs;
    cur = pool.length ? pool[Math.floor(Math.random() * pool.length)] : all.find(n => !visited.has(n.id));
  }
  return seq;
}
function startPulseAnim() {
  if (pulseRAF) return;
  const tick = () => {
    let any = false;
    pulses.forEach((v, k) => { const nv = v - 0.02; if (nv <= 0) pulses.delete(k); else { pulses.set(k, nv); any = true; } });
    pulseRAF = any ? requestAnimationFrame(tick) : null;
  };
  pulseRAF = requestAnimationFrame(tick);
}
// Re-apply visibility so revealed/filter changes show immediately.
function refreshViz() {
  Graph.nodeVisibility(n => !growMode || revealed.has(n.id));
  Graph.linkVisibility(l => activeTypes.has(l.type) && (!growMode || (revealed.has(idOf(l.source)) && revealed.has(idOf(l.target)))));
}
function readout(f) {
  const a = document.getElementById('act');
  a.textContent = `[${actIdx}/${actSeq.length}] ${f ? (f.date ? f.date + ' · ' : '') + f.label : ''}`; a.style.display = 'block';
  document.getElementById('rcount').textContent = revealed.size + ' / ' + Object.keys(byId).length + ' items';
  document.getElementById('scrub').value = actIdx;
}
function applyFrame(f) {            // reveal + pulse the frame's nodes, highlight them
  highlightNodes.clear(); highlightLinks.clear();
  f.ids.forEach(id => {
    revealed.add(id); pulses.set(id, 1);
    const n = byId[id]; if (n) { highlightNodes.add(n); (n.neighbors || []).forEach(x => highlightNodes.add(x)); (n.adj || []).forEach(l => highlightLinks.add(l)); }
  });
  startPulseAnim();
  const first = byId[f.ids[0]];
  if (first) hoverNode = first;
  // Dynamic zoom: frame everything revealed so far, so the camera follows the
  // build outward as time moves (instead of jumping to a single node).
  Graph.zoomToFit(Math.min(stepMs * 0.9, 700), 55, n => revealed.has(n.id));
}
function step() {
  if (!playing) return;
  if (actIdx >= actSeq.length) { Object.keys(byId).forEach(id => revealed.add(id)); refreshViz(); stopPlay(); return; }
  const f = actSeq[actIdx++];
  applyFrame(f); refreshViz(); readout(f);
  playTimer = setTimeout(step, stepMs);
}
function startPlay() {
  if (playing) return;
  if (!actSeq.length) actSeq = buildActivitySeq();
  if (!actSeq.length) return;
  if (actIdx >= actSeq.length) { revealed.clear(); actIdx = 0; }   // restart if finished
  growMode = true; playing = true;
  document.getElementById('scrub').max = actSeq.length;
  document.getElementById('play').textContent = '⏸ pause';
  refreshViz();
  step();
}
function stopPlay() {
  playing = false; clearTimeout(playTimer);
  document.getElementById('play').textContent = '▶ replay';
}
function togglePlay() { playing ? stopPlay() : startPlay(); }
function setSpeed(v) { stepMs = Math.round(1500 / v); }            // 1..12 → ~1500..125 ms
function scrubTo(v) {                                              // seek: rebuild revealed up to v
  stopPlay();
  if (!actSeq.length) actSeq = buildActivitySeq();
  if (!actSeq.length) return;
  growMode = true; actIdx = Math.max(0, Math.min(v, actSeq.length));
  revealed.clear();
  for (let i = 0; i < actIdx; i++) actSeq[i].ids.forEach(id => revealed.add(id));
  refreshViz(); readout(actSeq[Math.max(0, actIdx - 1)]);
  Graph.zoomToFit(400, 55, n => revealed.has(n.id));
}

// ── Keyboard-centric navigation (when not typing in the search box) ──
function selNb() {
  for (let i = 0; i < 40; i++) { const r = document.getElementById('nb-' + i); if (r) r.classList.toggle('sel', i === nbSel); }
  const cur = document.getElementById('nb-' + nbSel); if (cur) cur.scrollIntoView({ block: 'nearest' });
  if (panelNbs[nbSel]) previewNode(panelNbs[nbSel], true);   // live: pan/light the node
}
addEventListener('keydown', e => {
  if (document.activeElement === qEl) return;          // search owns keys when focused
  if (e.key === '/') { e.preventDefault(); qEl.focus(); return; }
  if (e.key === ' ') { e.preventDefault(); togglePlay(); return; }
  if (e.key === 'Backspace' || (e.altKey && e.key === 'ArrowLeft')) { e.preventDefault(); panelBack(); return; }
  if (e.key === 'Escape') { document.getElementById('panel').classList.remove('open'); fitAll(); return; }
  if (e.key === 'f' || e.key === 'F') { fitAll(); return; }   // fit / full view
  if (e.key === 'h' || e.key === 'H') { document.body.classList.toggle('hideui'); return; }   // hide chrome
  if ((e.key === 'o' || e.key === 'O') && panelCur && byId[panelCur]) { openEditor(byId[panelCur]); return; }
  const open = document.getElementById('panel').classList.contains('open');
  const max = Math.min(panelNbs.length, 40);
  if (!open || !max) return;
  if (e.key === 'ArrowDown' || e.key === 'j') { nbSel = Math.min(nbSel + 1, max - 1); selNb(); e.preventDefault(); }
  else if (e.key === 'ArrowUp' || e.key === 'k') { nbSel = nbSel < 0 ? 0 : Math.max(nbSel - 1, 0); selNb(); e.preventDefault(); }
  else if (e.key === 'Enter' && nbSel >= 0) { focusNode(panelNbs[nbSel]); e.preventDefault(); }
});

document.getElementById('panel').addEventListener('mouseleave', restoreFocus);

showOverview();
if (hasDrill) document.getElementById('hint').textContent = 'click a community to expand · ← to go back · drag/scroll to navigate';
</script>
</body>
</html>
