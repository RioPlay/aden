<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aden · graph</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(1200px 800px at 70% -10%, #141a26 0%, #0b0e14 60%);
    color: #cdd6f4; font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  #graph { position: fixed; inset: 0; }
  #hdr { position: fixed; left: 14px; top: 12px; font-weight: 600; letter-spacing: .04em;
    color: #b4befe; text-shadow: 0 0 18px rgba(137,180,250,.35); pointer-events: none; }
  #hdr small { color: #6c7086; font-weight: 400; letter-spacing: 0; }
  #hint { position: fixed; left: 14px; bottom: 12px; color: #585b70; pointer-events: none; }
  #panel { position: fixed; top: 0; right: 0; width: 330px; max-height: 100%; overflow: auto;
    background: rgba(17,21,30,.90); border-left: 1px solid #1f2430; padding: 16px 18px;
    backdrop-filter: blur(8px); transform: translateX(102%); transition: transform .26s cubic-bezier(.2,.7,.2,1);
    box-shadow: -20px 0 60px rgba(0,0,0,.35); }
  #panel.open { transform: none; }
  #panel h2 { margin: 0 0 10px; font-size: 14px; color: #89b4fa; word-break: break-all; line-height: 1.3; }
  #panel .k { color: #6c7086; }
  #panel .row { margin: 5px 0; word-break: break-all; }
  #panel .sec { margin-top: 12px; color: #9399b2; font-weight: 600; border-top: 1px solid #1f2430; padding-top: 10px; }
  #panel .nb { color: #a6adc8; }
  /* dark, consistent hover tooltip (force-graph injects .graph-tooltip) */
  .graph-tooltip { background: rgba(17,21,30,.96) !important; color: #cdd6f4 !important;
    border: 1px solid #313244; border-radius: 6px; padding: 5px 9px !important;
    font: 12px ui-sans-serif, system-ui, sans-serif !important; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .graph-tooltip b { color: #89b4fa; }
</style>
</head>
<body>
<div id="hdr">aden <small>· graph</small></div>
<div id="graph"></div>
<div id="panel"><h2 id="p-title"></h2><div id="p-body"></div></div>
<div id="hint">drag to pan · scroll to zoom · click a node · click background to close</div>
<script>/*FORCE_GRAPH_LIB*/</script>
<script>
const DATA = /*ADEN_DATA*/;

// Adapt aden's JSON (nodes[{id,anchor,label,kind,community,root}], edges[{from,to,type}])
// to force-graph's {nodes, links}.
const byId = {};
const nodes = (DATA.nodes || []).map(n => { const c = { ...n }; byId[n.id] = c; return c; });
const links = (DATA.edges || []).map(e => ({ source: e.from, target: e.to, type: e.type }));

// Degree → node size (importance reads at a glance).
const deg = {};
links.forEach(l => { deg[l.source] = (deg[l.source] || 0) + 1; deg[l.target] = (deg[l.target] || 0) + 1; });
nodes.forEach(n => n.deg = deg[n.id] || 0);

// Perceptually-spaced community palette; root/non-root fallback for anchor views.
const palette = ['#89b4fa','#f38ba8','#a6e3a1','#fab387','#cba6f7','#94e2d5',
                 '#f9e2af','#eba0ac','#74c7ec','#b4befe','#f5c2e7','#a6e3a1'];
function colorOf(n) {
  if (n.community != null) return palette[n.community % palette.length];
  if (n.root) return '#f38ba8';
  return '#89b4fa';
}
const idOf = e => (e && e.id != null) ? e.id : e;

const el = document.getElementById('graph');
const Graph = ForceGraph()(el)
  .backgroundColor('rgba(0,0,0,0)')
  .graphData({ nodes, links })
  .nodeId('id')
  .nodeLabel(n => `<b>${esc(shortName(n))}</b>${context(n) ? ` <span style="color:#6c7086">${esc(context(n))}</span>` : ''}`)
  .nodeRelSize(3)
  .nodeVal(n => n.size != null ? Math.min(2 + Math.sqrt(n.size), 12) : 1 + Math.min(Math.sqrt(n.deg), 3))
  .nodeColor(colorOf)
  .linkColor(() => 'rgba(120,130,170,.30)')
  .linkWidth(1)
  .linkDirectionalArrowLength(3.5)
  .linkDirectionalArrowRelPos(1)
  .linkLabel(l => l.type)
  .linkDirectionalParticles(0)
  .onNodeHover(n => { el.style.cursor = n ? 'pointer' : 'default'; })
  .onNodeClick(showPanel)
  .onBackgroundClick(() => document.getElementById('panel').classList.remove('open'));

function fit() { Graph.width(innerWidth).height(innerHeight); }
addEventListener('resize', fit); fit();
// Spread nodes apart so they don't blob together.
Graph.d3Force('charge').strength(-140);
const _lf = Graph.d3Force('link'); if (_lf) _lf.distance(38);
setTimeout(() => Graph.zoomToFit(600, 70), 500);

function esc(s) { return String(s).replace(/[&<>]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[c])); }
function row(k, v) { return `<div class="row"><span class="k">${k}:</span> ${esc(v)}</div>`; }
// The "actual call" / original function name — the symbol, truncated from its anchor.
function shortName(n) { const a = n.label || n.anchor || n.id || ''; return String(a).split('#').pop().split('/').pop(); }
// File/group context (everything before the symbol) for the tooltip subtitle.
function context(n) { if (n.size != null) return n.size + ' symbols'; const a = n.anchor || ''; const h = a.indexOf('#'); return (h >= 0 ? a.slice(0, h) : '').split('/').pop(); }

function showPanel(n) {
  const rows = [];
  if (n.size != null) rows.push(row('symbols', n.size));
  if (n.kind) rows.push(row('kind', n.kind));
  if (n.community != null) rows.push(row('community', n.community));
  rows.push(row('degree', n.deg));
  const nbs = links
    .filter(l => idOf(l.source) === n.id || idOf(l.target) === n.id)
    .map(l => {
      const o = idOf(l.source) === n.id ? idOf(l.target) : idOf(l.source);
      const dir = idOf(l.source) === n.id ? '→' : '←';
      return `<div class="row nb">${dir} ${esc(shortName(byId[o] || { id: o }))} <span class="k">${esc(l.type)}</span></div>`;
    });
  document.getElementById('p-title').textContent = shortName(n);
  document.getElementById('p-body').innerHTML =
    (n.anchor ? `<div class="row" style="color:#6c7086; word-break:break-all">${esc(n.anchor)}</div>` : '') +
    rows.join('') +
    `<div class="sec">neighbours (${nbs.length})</div>` +
    nbs.slice(0, 40).join('');
  document.getElementById('panel').classList.add('open');
}
</script>
</body>
</html>
