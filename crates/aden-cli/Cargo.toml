[package]
name = "aden-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "aden"
path = "src/main.rs"

[dependencies]
aden-core = { path = "../aden-core" }
aden-parse = { path = "../aden-parse" }
aden-emit = { path = "../aden-emit" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aden-graph = { version = "0.1.0", path = "../aden-graph" }
aden-asm = { version = "0.1.0", path = "../aden-asm" }
aden-index = { path = "../aden-index" }
notify = { version = "8.2.0", optional = true }
aden-heal = { version = "0.1.0", path = "../aden-heal" }
aden-propose = { version = "0.1.0", path = "../aden-propose" }
regex = "1.11"
dirs = "6"
walkdir = "2"

[features]
default = ["watch"]
watch = ["notify"]
