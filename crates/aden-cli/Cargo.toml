[package]
name = "aden-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "aden"
path = "src/main.rs"

[dependencies]
aden-core = { path = "../aden-core" }
aden-paths = { path = "../aden-paths" }
aden-parse = { path = "../aden-parse" }
aden-emit = { path = "../aden-emit" }
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aden-graph = { version = "0.4.0", path = "../aden-graph" }
aden-asm = { version = "0.4.0", path = "../aden-asm" }
aden-index = { path = "../aden-index" }
notify = { version = "8.2.0", optional = true }
ctrlc = { version = "3.2", optional = true }
aden-heal = { version = "0.4.0", path = "../aden-heal" }
aden-propose = { version = "0.4.0", path = "../aden-propose" }
aden-policy = { version = "0.4.0", path = "../aden-policy" }
regex = "1.11"
dirs = "6"
toml_edit = "0.25"
walkdir = "2"
toml = "1"
ureq = { version = "3", optional = true }
sha2 = { workspace = true, optional = true }
aden-diagnose = { path = "../aden-diagnose" }
aden-store = { path = "../aden-store" }
rayon.workspace = true

[dev-dependencies]
aden-mcp = { path = "../aden-mcp" }
sha2 = { workspace = true }
serde_json = "1.0"
tempfile = "3"

[features]
default = ["watch", "view"]
watch = ["notify", "ctrlc"]
# Network fallback for `aden licenses --full` (crates.io / npm / PyPI / deps.dev).
# Off by default — the offline lockfile/registry table works without it. Opt in
# with `--features licenses-net`; pulls ureq (and its rustls/ring TLS stack).
licenses-net = ["dep:ureq"]
# Restore on-demand fetch of the full tree-sitter grammar pack (PowerShell and
# the 300+ long tail) via aden-parse. Off by default — keeps the build slim and
# CI network-free (only TSLP_LANGUAGES grammars are built in). Integration tests
# that assert a non-build-time grammar (e.g. the PowerShell half of
# `polyglot_python_powershell`) are gated behind this feature.
grammars-download = ["aden-parse/grammars-download"]
# Local dense embeddings for hybrid retrieval (search/ask). Off by default — opt
# in with `--features dense`. Pulls the tract + tokenizers stack via aden-index.
dense = ["aden-index/dense"]
# Opt-in network fetch of the bge embedding model (`aden model fetch`). Off by
# default so the core binary stays network-free by design (see
# scripts/fetch-bge-model.sh). Pulls ureq only when enabled; offline/air-gapped
# users place the model files by hand instead.
model-fetch = ["dep:ureq", "dep:sha2"]
# Browser graph viewer (`aden view`). ON by default (in `default`); disable with
# `--no-default-features`. Embeds the vendored, pinned force-graph UMD bundle (MIT)
# into the binary; no extra crates, no runtime network. See assets/CHECKSUMS.
view = []
