[package]
name = "aden-mcp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "aden-mcp"
path = "src/main.rs"

[dependencies]
aden-core = { path = "../aden-core" }
aden-parse = { path = "../aden-parse" }
aden-graph = { path = "../aden-graph" }
aden-asm = { path = "../aden-asm" }
aden-index = { path = "../aden-index" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
