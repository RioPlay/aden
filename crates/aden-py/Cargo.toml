[package]
name = "aden-py"
version = "0.1.0"
edition = "2021"
authors = ["RioPlay <rioplay@rioplay.dev>"]
license = "AGPL-3.0"
description = "STANDALONE: Python bindings via PyO3 (build separately)"

[lib]
name = "aden"
crate-type = ["cdylib"]

[workspace]

[dependencies]
aden-core = { path = "../aden-core" }
aden-parse = { path = "../aden-parse" }
aden-emit = { path = "../aden-emit" }
aden-graph = { path = "../aden-graph" }
aden-asm = { path = "../aden-asm" }
aden-index = { path = "../aden-index" }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }
serde_json = "1.0"
petgraph = "0.8"

[package.metadata.aden]
status = "standalone"
integrated = false
notes = "Python bindings via PyO3. Excluded from workspace (requires Python dev headers). Build with: cd crates/aden-py && cargo build"
