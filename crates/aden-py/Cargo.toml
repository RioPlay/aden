[package]
name = "aden-py"
version = "0.1.0"
edition = "2021"
authors = ["RioPlay <rioplay@rioplay.dev>"]
license = "AGPL-3.0"

[lib]
name = "aden"
crate-type = ["cdylib"]

[workspace]

[dependencies]
aden-core = { path = "../aden-core" }
aden-parse = { path = "../aden-parse" }
aden-emit = { path = "../aden-emit" }
aden-graph = { path = "../aden-graph" }
aden-asm = { path = "../aden-asm" }
aden-index = { path = "../aden-index" }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py310"] }
serde_json = "1.0"
petgraph = "0.8"
