[package]
name = "aden-parse"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
aden-core = { path = "../aden-core" }
tree-sitter = { version = "0.26", optional = true }
# Slim by default: `dynamic-loading` (no `download`) drops the ureq/sha2/tar/zstd
# stack tslp's default `download` feature would pull. The build-time grammars
# (TSLP_LANGUAGES in .cargo/config.toml) still load; the long tail is opt-in via
# the `grammars-download` feature below.
tree-sitter-language-pack = { version = "1.8", optional = true, default-features = false, features = ["dynamic-loading"] }
# Used (slim path only) to locate the on-disk grammar cache; see lib.rs TS_REGISTRY.
dirs = { version = "6", optional = true }

[dev-dependencies]
serde_json = "1.0"
tempfile = "3"

[features]
default = ["tree-sitter", "generic"]
generic = ["tree-sitter", "tree-sitter-language-pack", "dep:dirs"]
# Restore on-demand fetching of the full 300+ tree-sitter grammar pack. Off by
# default — pulls tslp's `download` feature (ureq + sha2 + tar + zstd). With it
# off, parsing falls back to the build-time grammars + locally cached `.so`s.
grammars-download = ["generic", "tree-sitter-language-pack/download"]
