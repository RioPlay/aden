[package]
name = "aden-parse"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
aden-core = { path = "../aden-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = { version = "0.26", optional = true }
tree-sitter-language-pack = { version = "1.8", optional = true }
fnv = "1"

[dev-dependencies]
serde_json = "1.0"

[features]
default = ["tree-sitter", "generic", "rust-deep"]
rust-deep = ["tree-sitter", "tree-sitter-language-pack"]
generic = ["tree-sitter", "tree-sitter-language-pack"]
