[package]
name = "aden-lsp"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "aden-lsp"
path = "src/main.rs"

[dependencies]
aden-core = { path = "../aden-core" }
aden-graph = { path = "../aden-graph" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "io-std"] }
serde_json = "1.0"
